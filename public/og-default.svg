<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Living Axis — mobile massage therapy, Brooklyn and greater New York City">
  <rect width="1200" height="630" fill="#12474D"/>
  <g fill="none" stroke="#8FA893" stroke-opacity="0.35">
    <circle cx="600" cy="315" r="250" stroke-width="1"/>
    <circle cx="600" cy="315" r="180" stroke-width="1"/>
  </g>
  <line x1="600" y1="150" x2="600" y2="480" stroke="#8FA893" stroke-opacity="0.5" stroke-width="1"/>
  <text x="600" y="300" text-anchor="middle" fill="#F6F1E7"
        font-family="Cormorant Garamond, Georgia, serif" font-size="76" font-weight="600" letter-spacing="8">
    THE LIVING AXIS
  </text>
  <text x="600" y="360" text-anchor="middle" fill="#F6F1E7" fill-opacity="0.75"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4">
    MOBILE MASSAGE THERAPY
  </text>
  <text x="600" y="400" text-anchor="middle" fill="#8FA893"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">
    BROOKLYN &#183; GREATER NEW YORK CITY
  </text>
</svg>
