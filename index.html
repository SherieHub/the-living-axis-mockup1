    <!-- Per-route <title>, description, canonical, Open Graph and Twitter tags

         the document for crawlers that do not execute JavaScript. -->
    <title>Mobile Massage Therapy in Brooklyn, NY | The Living Axis</title>
    <meta name="description" content="Deep tissue, sports, restorative and prenatal massage brought to your own space across Brooklyn and greater New York City." />

    <meta property="og:site_name" content="The Living Axis" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mobile Massage Therapy in Brooklyn, NY | The Living Axis" />
    <meta property="og:description" content="Deep tissue, sports, restorative and prenatal massage brought to your own space across Brooklyn and greater New York City." />
    <meta property="og:image" content="/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
